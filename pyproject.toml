[project]
name = "lc-translator"
version = "0.1.0"
description = "MT700 to camt.087 Letter of Credit translation demo"
requires-python = ">=3.9"
authors = [{ name = "Your Name", email = "you@example.com" }]
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0",
    "lxml>=4.9",
    "faker>=20.0",
    "typer>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "freezegun>=1.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.scripts]
lc-translator = "lc_translator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "D"]
ignore = ["D100", "D104", "E501", "UP045", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*", "lxml.*"]
ignore_missing_imports = true

disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=lc_translator --cov-report=term-missing"
