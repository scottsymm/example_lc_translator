[project]
name = "lc-translator-monorepo"
version = "0.2.0"
description = "Monorepo for the LC Translator engine, API, and web UI"
requires-python = ">=3.9"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "lc-translator-core",
    "lc-translator-api",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "freezegun>=1.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "httpx>=0.27",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
lc-translator-core = { workspace = true }
lc-translator-api = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "D"]
ignore = ["D100", "D104", "E501", "UP045", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*", "lxml.*"]
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["packages"]
python_files = ["test_*.py"]
addopts = "--cov=lc_translator_core --cov=lc_translator_api --cov-report=term-missing"
