[project]
name = "lc-translator-core"
version = "0.2.0"
description = "Reusable MT700-to-MX Letter of Credit translation engine"
requires-python = ">=3.9"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0",
    "lxml>=4.9",
    "faker>=20.0",
    "typer>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "freezegun>=1.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.scripts]
lc-translator = "lc_translator_core.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lc_translator_core"]
